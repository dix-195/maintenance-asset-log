name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          : "${ANDROID_HOME:?Android SDK is missing from the runner image}"
          for sdk_file in platforms/android-35/android.jar build-tools/35.0.0/aapt2; do
            if [[ ! -f "$ANDROID_HOME/$sdk_file" ]]; then
              echo "::error::Missing Android SDK file: $ANDROID_HOME/$sdk_file"
              exit 1
            fi
          done
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-asset-log-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
